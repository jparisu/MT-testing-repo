[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "testing-lib"
version = "0.1.0"
description = "Testing repo for MT class."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "jparisu" }]
dependencies = []

[tool.setuptools]
packages = ["testing_lib"]

[tool.setuptools.package-dir]
testing_lib = "src/testing-lib"
